# Runtime endpoints for the deployed agent.
#
# The `event_broker:` block is injected here at deploy time
# (lib/engine/endpoints-config.ts) carrying the deployment's serve
# credential, so the intake receives this agent's conversation events with
# real attribution. Engine serves get their own render of this block in the
# bot session's config (lib/engine/model-service/provider.ts) carrying an
# ephemeral credential for THAT serve's context — every serve reports; the
# context on the credential is what keeps test/simulation traffic out of the
# production record. The broker module itself is the rasa-aero-runtime
# package, installed in the engine's environment, not a project file.

# In-process custom action server. Skills prefer their own tools.py; this stays
# for shared custom actions (e.g. human handoff).
action_endpoint:
  actions_module: "actions"

# Tracker store defaults to in-memory if omitted.
