# Auto-loaded by `rasa run` (default path, no --credentials flag needed).
#
# IMPORTANT: `rest` must be listed explicitly here. rasa.api.run only
# falls back to the REST connector when NO credentials.yml exists at all
# (`if not connector and not credentials: connector = "rest"`) — once any
# credentials.yml is present, only the channels it lists get registered.
# Without this line, adding the WebChatInput channel below silently
# disabled /webhooks/rest/webhook entirely, breaking both the local Test
# panel and talk_to_assistant (confirmed live: 404 on /webhooks/rest/webhook
# once this file existed without an explicit `rest:` entry).
rest:
# Adds a shareable, browsable chat page (at /webhooks/chat/) on top of the
# same message-handling logic as the built-in rest channel. The module lives
# in the rasa-aero-runtime package, installed in the engine's environment
# (the venv locally, the base image for deploys) — never a project file.
rasa_aero_runtime.custom_channel.WebChatInput:

# REQUIRED twice over on the 3.20 line: the model service's zip lane refuses
# a training whose credentials.yml lacks the `inspector` key
# (validate_credentials_has_inspector — the Builder once burned a fix round
# adding this by hand, 2026-09-02), and the service's socket bridge reaches
# the bot through this channel for every app conversation.
#
# There is deliberately NO `socketio:` entry beside it. 3.20's
# InspectorInputChannel registers a blueprint literally named
# "socketio_webhook", so declaring both channels kills the bot at boot with
# "A blueprint with the name socketio_webhook is already registered"
# (measured live 2026-09-02 — every simulation serve of a scaffolded agent
# died instantly). The dev4-era socketio entry this file used to carry, evt
# overrides and all, is retired with that line.
inspector:
