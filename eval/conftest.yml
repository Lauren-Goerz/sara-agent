# Simulation / evaluation suite for Sara.
# Run via Rasa MCP: `rasa tools run --mode stdio`, then ask to run eval/scenarios/.
# Needs RASA_LICENSE + OPENAI_API_KEY (loaded from .env).

simulation:
  llm:
    provider: openai
    model: gpt-5.1
    timeout: 60
evaluation:
  llm:
    provider: openai
    model: gpt-5.1
    timeout: 60
