responses:
  utter_privacy_notice:
    - text: >-
        Quick note before we start. I'm an AI agent operated by Rasa. Your
        messages are processed to [purpose], on the basis of [lawful basis],
        and kept for [retention period]. What applies to you as an employee
        is set out at [employee privacy notice link]. Rasa's general privacy
        policy is at https://rasa.com/privacy-policy.

        You can access, correct or delete your data, object to processing, or
        complain to your data protection authority. Contact Rasa's Data
        Protection Officer at [DPO email], Rasa Technologies GmbH,
        Schoenhauser Allee 175, 10119 Berlin. Rasa aims to respond within 30
        days.

        Please don't share sensitive details with me, including health, pay,
        or anything about a colleague. Take those to your People Ops contact
        directly.

        Ask me "what happens to my data" any time to see this again.
