responses:
  utter_gdpr_letter_request_for_data:
    - text: >-
        Dear <Name>,
        We thank you for your inquiry from <DD.MM.YYYY>.

        We hereby confirm that we process personal data concerning you. As requested by you, we will gladly provide you with the following information.

        We process the following personal data about you:
        <please list the data stored about the person, e.g. first/last name + e-mail address +
        phone number>

        The data originates from the following sources:
        <e.g. chatbot dialouge on our website>

        Your data is being processed for the following purpose:
        <e.g. to follow up with your contact request>

        Your data is processed by the following recipients:
        <e.g. Hosting provider that enables our server and chatbot infrastructure (Digital Ocean
        LLC.)>

        The data is stored only until after completion of the contact request or - in case of conclusion of contract - at the end of the business relationship. Transactional or invoice related data - if applicable - is stored for longer periods of time depending on storage requirements that stem from local retention and bookkeeping laws. A deletion is of course also carried out if a corresponding deletion request is sent to us and if no law prohibits us from deleting the data.

        <[If deletion is requested, like in this case] We have deleted all of your personal data as
        requested by you.>

        We hope that we were able to help you with this information.

        With kind regards,

        Rasa Privacy Team

  utter_gdpr_letter_deletion_confirmation:
    - text: >-
        Dear <Name>,

        We thank you for your inquiry from <DD.MM.YYYY>.

        Following your request for data deletion, we would like to confirm that your personal data has been deleted from our systems.

        Kind regards,

        Rasa Privacy Team

  utter_gdpr_letter_generic_no_data:
    - text: >-
        Dear <Name>,

        We thank you for your inquiry from <DD.MM.YYYY>.

        Please be advised that GDPR requires us to verify the identity of someone requesting data
        to ensure the request is legitimate. Rasa does this by matching the e-mail address to its
        database.

        We reviewed our systems internally and we did not process any personal data related to the
        e-mail address that you provided.

        We hope that we were able to help you with this information.

        Kind regards,

        Rasa Privacy Team
