schema:
  public:
    parental_country:
      type: categorical
      enum_values: [uk, us, germany, serbia, france, other]
      description: >
        Employment country for parental leave after the user confirmed or
        corrected their Slack location.
      llm_settable: true
    location_confirmed:
      type: bool
      description: >
        True only after the user confirmed or corrected their employment
        country for parental leave guidance.
      llm_settable: true
